
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <strong>Campus</strong><span class="highlight">Hub</span>
        </div>

        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">Courses</a>
            <a href="#">Contact</a>
        </nav>

        <div class="theme-toggle">
            <label for="darkMode">Dark mode</label>
            <label class="switch">
                <input type="checkbox" id="darkMode">
                <span class="slider"></span>
            </label>
        </div>
    </header>

    <main>
        <section class="profile-card">

            <div class="avatar">MS</div>

            <h2>Mirai Sato</h2>
            <p class="subtitle">BS Information Technology, 3rd Year</p>

            <div class="skills">
                <span class="tag">HTML</span>
                <span class="tag">CSS</span>
                <span class="tag">JavaScript</span>
            </div>

            <div class="actions">
                <button id="likeBtn" class="btn-primary">
                    ♥ Like <span id="likeCount" class="badge">24</span>
                </button>

                <button id="resetBtn" class="btn-secondary">Reset</button>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 CampusHub. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
